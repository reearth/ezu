name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

  test:
    name: test (${{ matrix.os }})
    # Runner choice, for whoever changes this matrix: no test may depend
    # on a font being installed. Text rendering is covered by the OFL
    # fixtures under `crates/ezu-core/tests/fonts/`, which travel with the
    # repo; the one test that touches the OS font database
    # (`system_font_resolves_whatever_the_host_has`) resolves whatever
    # family that database reports and skips when it reports none. Runner
    # images change their bundled fonts without notice, and a container
    # may ship none at all, so naming a family here would be a test that
    # fails on someone else's infrastructure rather than on our code.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - run: cargo build --workspace --all-features
      - run: cargo test  --workspace --all-features

  wasm:
    name: wasm32 build (ezu-wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      # Build only the wasm-targeted crate; ezu-pmtiles and ezu-server pull
      # native-only deps (tokio fs/mmap/net, axum) and aren't expected to
      # compile for wasm32-unknown-unknown.
      - run: cargo build -p ezu-wasm --target wasm32-unknown-unknown --release
      - name: Verify +simd128 build
        run: cargo build -p ezu-wasm --target wasm32-unknown-unknown --release
        env:
          RUSTFLAGS: -C target-feature=+simd128 -Dwarnings

  wasm-threads:
    name: wasm32 threads build (ezu-wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The multithreaded build rebuilds std with atomics (`-Z build-std`),
      # which needs a nightly toolchain and the `rust-src` component.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      # Compile-only: validates the `threads` feature and the atomics /
      # shared-memory link flags. wasm-bindgen / wasm-opt (packaging) are a
      # separate local step (see crates/ezu-wasm/README.md).
      - name: Build threads flavor
        run: |
          cargo build -p ezu-wasm --release \
            --target wasm32-unknown-unknown \
            --features threads \
            -Z build-std=panic_abort,std
        env:
          RUSTFLAGS: >-
            -C target-feature=+atomics,+bulk-memory,+mutable-globals
            -C link-arg=--shared-memory
            -C link-arg=--import-memory
            -C link-arg=--max-memory=1073741824
            -C link-arg=--export=__heap_base
            -C link-arg=--export=__wasm_init_tls
            -C link-arg=--export=__tls_size
            -C link-arg=--export=__tls_align
            -C link-arg=--export=__tls_base

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - run: cargo build --workspace --all-features
