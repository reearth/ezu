name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

# Tighten the default token: trusted publishing uses the OIDC route, so
# the workflow doesn't need anything beyond `id-token: write` for that,
# plus `contents: write` to create the GitHub Release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # `crates-io` is a deployment environment with required reviewers and
    # a `v*` tag policy, so cargo publish only runs after a maintainer
    # approves the deployment on a tag push.
    environment:
      name: crates-io
      url: https://crates.io/crates/ezu
    permissions:
      contents: read
      id-token: write   # rust-lang/crates-io-auth-action exchanges this OIDC token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Verify workspace
        run: cargo build --workspace --all-features

      # Trusted publishing: exchange the workflow's OIDC token for a
      # short-lived crates.io token. Requires the repo+workflow to be
      # registered as a Trusted Publisher on each crate at
      # https://crates.io/crates/<name>/owners.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      # Publish each crate in dependency-topological order. Re-running the
      # release for a tag (e.g. after a partial failure) is idempotent: any
      # crate whose `<name>@<version>` is already on crates.io is skipped
      # with a notice, so the workflow only attempts the *missing* crates.
      # `cargo publish --workspace` would fail hard on the first already-
      # uploaded crate, which is why we drive the loop manually.
      # ezu-wasm is `publish = false` (shipped to npm instead) and is
      # intentionally not listed.
      - name: Publish workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set +e
          for crate in ezu-core ezu-style ezu-graph ezu-features ezu-paint ezu-translate ezu ezu-cli; do
            echo "::group::cargo publish -p $crate"
            output=$(cargo publish -p "$crate" 2>&1)
            status=$?
            echo "$output"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              if echo "$output" | grep -qE "already (uploaded|exists)"; then
                echo "::notice::$crate already published, skipping"
              else
                echo "::error::$crate publish failed"
                exit "$status"
              fi
            fi
          done

  # Prebuilt `ezu` binaries, so the CLI can be installed without a Rust
  # toolchain. Nothing here is gated on an environment: the builds start
  # as soon as the tag lands, and only the release that publishes them
  # waits for the crates.io approval.
  build-cli:
    name: build ezu (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run on 22.04 rather than the latest image so the
          # binaries link against glibc 2.35 and still run on Ubuntu 22.04,
          # Debian 12 and RHEL 9. A musl build would drop the glibc floor
          # entirely, at the cost of musl's allocator on a renderer that
          # allocates hard across threads.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # Both macOS slices build on the arm64 image; every dependency is
          # pure Rust or builds with the Apple toolchain's cross support.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p ezu-cli --target ${{ matrix.target }}

      # `.tar.gz` for the Unix targets, `.zip` for Windows, each holding the
      # binary next to the README and both licences. Windows keeps its debug
      # info in a separate `.pdb`, so there is nothing to strip there.
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          stage="ezu-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$stage"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/ezu.exe" "$stage/"
            7z a "$stage.zip" "$stage" > /dev/null
            echo "asset=$stage.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/ezu" "$stage/"
            strip "$stage/ezu"
            tar czf "$stage.tar.gz" "$stage"
            echo "asset=$stage.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke-test the binary
        # The cross-compiled x86_64 macOS build can't run on the arm64 image.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: ./ezu-${GITHUB_REF_NAME}-${{ matrix.target }}/ezu --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ezu-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    # The release carries the binaries, so it waits for them, and it waits
    # for `publish` so that the crates are on crates.io before the release
    # notes point at them.
    needs: [publish, build-cli]
    permissions:
      contents: write   # softprops/action-gh-release needs to create the release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ezu-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum ezu-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

  # Point `brew install reearth/tap/ezu` at the archives this release just
  # attached. The formula is generated, never hand-edited, so the checksums
  # always describe the bytes on the release rather than a later guess.
  homebrew:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ezu-*
          merge-multiple: true
          path: dist

      # `GITHUB_TOKEN` is scoped to this repository, so pushing to the tap
      # needs the org's `reearth-app` installation. The token minted here is
      # narrowed to the one repository it writes to.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: reearth
          repositories: homebrew-tap

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: reearth/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap

      - name: Update the formula
        run: |
          mkdir -p tap/Formula
          ./scripts/brew-formula.sh "$GITHUB_REF_NAME" dist > tap/Formula/ezu.rb
          cat tap/Formula/ezu.rb

      - name: Push to the tap
        working-directory: tap
        run: |
          # The commit is authored as the app's own bot user, so the tap's
          # history attributes it to the installation rather than to
          # whoever happened to push the tag.
          git config user.name "${{ vars.GH_APP_USER }}"
          git config user.email "171218383+${{ vars.GH_APP_USER }}@users.noreply.github.com"
          git add Formula/ezu.rb
          # Re-running a release for the same tag regenerates an identical
          # formula; there is then nothing to commit and nothing to push.
          if git diff --cached --quiet; then
            echo "::notice::formula already up to date"
            exit 0
          fi
          git commit -m "ezu ${GITHUB_REF_NAME#v}"
          git push

  publish-npm:
    runs-on: ubuntu-latest
    # `npm` is a deployment environment with required reviewers and a
    # `v*` tag policy (same setup as `crates-io`). Authentication uses
    # npm Trusted Publishing: the workflow's OIDC token is exchanged for
    # a short-lived publish token, so no NPM_TOKEN secret is needed. The
    # trusted publisher must be registered on npmjs.com against this
    # repo + workflow + environment first; for the very first version
    # (before the package exists on npm) run `npm publish` manually once,
    # then CI takes over from the next tag.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@reearth/ezu
    permissions:
      contents: read
      id-token: write   # required for Trusted Publishing + provenance
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          key: wasm32

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Pin the npm version via Corepack so local and CI agree on what
      # `npm publish` does. The pinned version lives in
      # `crates/ezu-wasm/npm/package.json`'s `packageManager` field;
      # Trusted Publishing requires npm >= 11.5.1, and the pinned
      # version satisfies that.
      - name: Activate pinned npm via Corepack
        working-directory: crates/ezu-wasm/npm
        run: |
          corepack enable npm
          npm --version

      # wasm-bindgen-cli and the `wasm-bindgen` Rust dep must match
       # exactly. Pinning to the version locked by `js-sys` in
       # `Cargo.lock` avoids the "schema version mismatch" failure
       # when crates.io ships a newer bindgen than the lockfile picks.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@9185c192a96ba09167ad8663015b3fbbf007ec79 # v2.62.55
        with:
          tool: wasm-bindgen-cli@0.2.126,wasm-opt

      - name: Sync npm package version to tag
        working-directory: crates/ezu-wasm/npm
        run: |
          # Strip leading `v` from the git tag (refs/tags/vX.Y.Z → X.Y.Z).
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Build npm package
        run: ./scripts/build-wasm-npm.sh

      - name: Publish to npm
        working-directory: crates/ezu-wasm/npm
        run: |
          # Skip if this version is already on npm (idempotent re-run).
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version already on npm, skipping"
            exit 0
          fi
          # --provenance is implied when publishing via Trusted Publishing
          # but pass it explicitly so a misconfigured environment fails
          # loudly instead of silently falling back.
          npm publish --provenance --access public
