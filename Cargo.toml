[workspace]
resolver = "2"
members = [
    "crates/ezu",
    "crates/ezu-cli",
    "crates/ezu-compare",
    "crates/ezu-core",
    "crates/ezu-graph",
    "crates/ezu-features",
    "crates/ezu-translate",
    "crates/ezu-paint",
    "crates/ezu-style",
    "crates/ezu-wasm",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reearth/ezu"
homepage = "https://github.com/reearth/ezu"
authors = ["Eukarya Inc."]

[workspace.dependencies]
# Internal
ezu-core = { version = "0.8.0", path = "crates/ezu-core" }
ezu-graph = { version = "0.8.0", path = "crates/ezu-graph" }
ezu-features = { version = "0.8.0", path = "crates/ezu-features" }
ezu-translate = { version = "0.8.0", path = "crates/ezu-translate" }
ezu-paint = { version = "0.8.0", path = "crates/ezu-paint" }
ezu-style = { version = "0.8.0", path = "crates/ezu-style" }
ezu = { version = "0.8.0", path = "crates/ezu" }

# Brush engine
hokusai = { version = "0.3", default-features = false }

# Graphics
tiny-skia = "0.12"
libblur = "0.24"
ttf-parser = "0.25"
rustybuzz = "0.20"
fontdb = "0.23"
noise = { version = "0.9", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }

# Geo
geozero = { version = "0.15", default-features = false, features = ["with-mvt"] }
geojson = "0.24"
geo = "0.33"
i_overlay = "6"
voronoice = "0.2"
delaunator = "1"
pmtiles = { version = "0.23", default-features = false, features = ["mmap-async-tokio", "http-async", "reqwest-rustls"] }
bytes = "1"
tokio = { version = "1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Serde / utility
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
maplibre-expr = "0.3.2"
schemars = "1"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
inventory = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
