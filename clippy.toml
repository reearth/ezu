# Rendering must produce the same bytes on every host (see
# crates/ezu-paint/src/imaging/mod.rs). These float methods call the
# platform's libm natively and Rust's own on wasm, and the two can disagree
# in the last bit, so the render path uses the `libm` crate instead — the
# same code everywhere.
disallowed-methods = [
  { path = "f32::exp", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::exp2", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::exp_m1", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::ln", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::ln_1p", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::log", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::log2", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::log10", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::powf", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::sin", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::cos", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::tan", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::sin_cos", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::asin", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::acos", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::atan", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::atan2", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::sinh", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::cosh", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::tanh", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::asinh", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::acosh", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::atanh", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::cbrt", reason = "host-dependent rounding; use the libm crate" },
  { path = "f32::hypot", reason = "host-dependent rounding; use the libm crate" },
  { path = "f64::exp", reason = "host-dependent rounding; use the libm crate" },
