  { path = "f64::log", reason = "host-dependent rounding; use the libm crate" },
  { path = "f64::log2", reason = "host-dependent rounding; use the libm crate" },
  { path = "f64::log10", reason = "host-dependent rounding; use the libm crate" },
  { path = "f64::powf", reason = "host-dependent rounding; use the libm crate" },
  { path = "f64::sin", reason = "host-dependent rounding; use the libm crate" },
  { path = "f64::cos", reason = "host-dependent rounding; use the libm crate" },
  { path = "f64::tan", reason = "host-dependent rounding; use the libm crate" },
