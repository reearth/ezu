<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ezu — WASM single-tile demo</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; height: 100%; background: #fbf6e6; color: #382a1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { display: flex; gap: 24px; padding: 24px; align-items: flex-start; }
  aside { width: 340px; font-size: 13px; line-height: 1.55; }
  h1 { margin: 0 0 8px; font-size: 16px; color: #5a4636; }
  .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  label { font-weight: 600; min-width: 60px; }
  input, select, button {
    font: inherit; padding: 4px 8px; border: 1px solid #c8b896; border-radius: 4px; background: #fdfbf1;
  }
  button { background: #5a4636; color: #fdfbf1; border: 0; cursor: pointer; padding: 6px 14px; font-weight: 600; }
  button:hover { background: #4a3424; }
  button:disabled { opacity: 0.4; cursor: default; }
  .stat { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #6a5040; }
  .stat .v { color: #382a1f; font-weight: 600; }
  .log { background: #f0e8d0; padding: 8px 10px; border-radius: 4px; font-family: ui-monospace, Menlo, monospace;
         font-size: 11px; min-height: 60px; white-space: pre-wrap; }
  canvas { background: #fff; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08); display: block; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.simd { background: #d6e2c8; color: #345122; }
  .badge.scalar { background: #efd9b4; color: #6a4f3a; }
  .badge.threads { background: #c8d8e2; color: #22415a; }
</style>
</head>
<body>
<main>
  <aside>
    <h1>ezu WASM single-tile demo</h1>
    <p>JS owns HTTP (fetches MVT bytes from <code>ezu serve</code>'s
       <code>/mvt</code> endpoint); WASM owns parse + paint + output
       with built-in brushes bundled at compile time.</p>

    <div class="row"><label>Build</label>
      <select id="build">
        <option value="simd">SIMD (+simd128)</option>
        <option value="scalar">Scalar</option>
        <option value="threads">Threads (SharedArrayBuffer)</option>
      </select>
    </div>
    <div class="row"><label>Output</label>
      <select id="format">
        <option value="rgba">RGBA → ImageData</option>
        <option value="png">PNG → &lt;img&gt;</option>
      </select>
    </div>
    <div class="row"><label>Tile</label>
      <input id="z" type="number" value="13" min="0" max="15" style="width:50px" />
      <input id="x" type="number" value="7276" style="width:80px" />
      <input id="y" type="number" value="3225" style="width:80px" />
    </div>
    <div class="row">
      <button id="render">Render</button>
      <button id="bench">Bench × 10</button>
      <button id="blank" title="Paper-only render (no MVT)">Blank</button>
      <span id="badge"></span>
    </div>
    <div class="stat">
      module:&nbsp;<span class="v" id="mod-ms">—</span>&nbsp;ms ·
      mvt:&nbsp;<span class="v" id="mvt-ms">—</span>&nbsp;ms ·
      render:&nbsp;<span class="v" id="render-ms">—</span>&nbsp;ms
    </div>
    <div class="stat">
      threads:&nbsp;<span class="v" id="threads">—</span> ·
      isolated:&nbsp;<span class="v" id="isolated">—</span>
    </div>
    <div class="stat" id="bench-stats"></div>
    <div class="log" id="log"></div>
  </aside>
  <canvas id="cv" width="512" height="512"></canvas>
</main>

<script type="module">
  // The built-in brushes bundled by `ezu-paint` are pre-registered
  // inside `new Renderer(...)` — no JS-side fetch needed.

  const $ = (id) => document.getElementById(id);
  const log = (...m) => { $("log").textContent += m.join(" ") + "\n"; };

  let renderer = null;
  let activeBuild = null;
  let styleJson = null;
  // Whether the active build should render with the parallel evaluator —
  // true only once a `threads` build's worker pool is up.
  let parallel = false;
  // One rayon thread pool per module instance; re-initializing throws.
  const pooled = new Set();

  async function loadStyle() {
    if (!styleJson) styleJson = await (await fetch("/style")).text();
    return styleJson;
  }

  async function loadBuild(name) {
    $("isolated").textContent = self.crossOriginIsolated ? "yes" : "no";
    if (activeBuild === name && renderer) return;
    if (renderer) renderer.free();
    const t = performance.now();
    log(`loading ${name}…`);
    const mod = await import(`/wasm/${name}/ezu_wasm.js?build=${name}`);
    await mod.default();

    // Multithreaded build: spin up the rayon pool once, if the page is
    // cross-origin isolated. Otherwise fall back to single-threaded.
    parallel = false;
    let threadInfo = "1 (serial)";
    if (mod.threadsEnabled?.()) {
      if (self.crossOriginIsolated) {
        const n = navigator.hardwareConcurrency || 4;
        if (!pooled.has(name)) {
          await mod.initThreadPool(n);
          pooled.add(name);
        }
        parallel = true;
        threadInfo = `${n} (parallel)`;
        log(`  thread pool: ${n} workers`);
      } else {
        threadInfo = "1 (not isolated)";
        log("  not cross-origin isolated (need COOP/COEP) — running serial");
      }
    }
    $("threads").textContent = threadInfo;

    renderer = new mod.Renderer(await loadStyle());
    activeBuild = name;
    $("mod-ms").textContent = (performance.now() - t).toFixed(1);
    const cls = mod.threadsEnabled?.() ? "threads" : (mod.simdEnabled() ? "simd" : "scalar");
    const label = mod.threadsEnabled?.() ? "Threads" : (mod.simdEnabled() ? "SIMD" : "Scalar");
    $("badge").className = "badge " + cls;
    $("badge").textContent = label;
    log(`  ${name}: ${label}${mod.simdEnabled() ? " +simd128" : ""}`);
  }

  function drawRgba(buf) {
    const w = renderer.tileSize, h = renderer.tileSize;
    const cv = $("cv");
    cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d");
    ctx.putImageData(new ImageData(new Uint8ClampedArray(buf.buffer, buf.byteOffset, buf.byteLength), w, h), 0, 0);
  }

  function drawPng(buf) {
    const w = renderer.tileSize, h = renderer.tileSize;
    const url = URL.createObjectURL(new Blob([buf], { type: "image/png" }));
    const img = new Image();
    img.onload = () => {
      const cv = $("cv");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  async function render({ mvt = "fetch", once = true } = {}) {
    const z = +$("z").value, x = +$("x").value, y = +$("y").value;
    await loadBuild($("build").value);

    let bytes = null, tMvt = 0;
    if (mvt === "fetch") {
      const t0 = performance.now();
      const r = await fetch(`/mvt/${z}/${x}/${y}`);
      if (r.ok) bytes = new Uint8Array(await r.arrayBuffer());
      else if (r.status !== 404) { log(`mvt fetch failed: ${r.status}`); return; }
      tMvt = performance.now() - t0;
    }
    $("mvt-ms").textContent = tMvt.toFixed(1);

    const format = $("format").value;
    const t1 = performance.now();
    // Bind into the first MVT source the style declared, render, clear.
    // (Demo styles all use a `basemap` source; for real apps, list the
    // names with `renderer.boundSources()` after binding.)
    renderer.clearSources();
    if (bytes) renderer.bindSource("basemap", bytes);
    const out = renderer.renderTile(z, x, y, { format, parallel });
    const tRender = performance.now() - t1;
    $("render-ms").textContent = tRender.toFixed(1);

    if (once) (format === "rgba" ? drawRgba : drawPng)(out);
    return { tMvt, tRender, outLen: out.length };
  }

  $("render").onclick = () => render();
  $("blank").onclick = () => render({ mvt: "none" });

  $("bench").onclick = async () => {
    $("bench-stats").textContent = "running…";
    await loadBuild($("build").value);
    const z = +$("z").value, x = +$("x").value, y = +$("y").value;
    const r = await fetch(`/mvt/${z}/${x}/${y}`);
    const bytes = r.ok ? new Uint8Array(await r.arrayBuffer()) : null;
    const fmt = $("format").value;
    const call = (b) => {
      renderer.clearSources();
      if (b) renderer.bindSource("basemap", b);
      return renderer.renderTile(z, x, y, { format: fmt, parallel });
    };

    call(bytes); // warm

    const samples = [];
    for (let i = 0; i < 10; i++) {
      const t = performance.now();
      call(bytes);
      samples.push(performance.now() - t);
    }
    samples.sort((a, b) => a - b);
    const median = samples[5], min = samples[0], max = samples[9];
    const mean = samples.reduce((a, b) => a + b, 0) / samples.length;
    const line = `bench (${activeBuild}, ${fmt}): min=${min.toFixed(1)} median=${median.toFixed(1)} mean=${mean.toFixed(1)} max=${max.toFixed(1)} ms`;
    $("bench-stats").textContent = line;
    log(line);
    $("render-ms").textContent = median.toFixed(1);
  };

  render();
</script>
</body>
</html>
