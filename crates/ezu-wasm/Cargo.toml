[package]
name = "ezu-wasm"
description = "WebAssembly bindings for the ezu painterly map renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ezu-core = { workspace = true }
ezu-graph = { workspace = true }
ezu-features = { workspace = true }
ezu-paint = { workspace = true }
ezu-style = { workspace = true }
hokusai = { workspace = true, features = ["myb-json"] }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter"] }

[features]
default = ["panic-hook"]
panic-hook = ["dep:console_error_panic_hook"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd"]
