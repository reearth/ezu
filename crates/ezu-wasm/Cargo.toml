[package]
name = "ezu-wasm"
description = "WebAssembly bindings for the ezu painterly map renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ezu-core = { workspace = true, features = ["text"] }
ezu-graph = { workspace = true }
ezu-features = { workspace = true }
ezu-paint = { workspace = true }
ezu-style = { workspace = true }
hokusai = { workspace = true, features = ["myb-json"] }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }
# Multithreaded rendering (`threads` feature). `no-bundler` is required
# because the demo loads the ES module directly in the browser without a
# bundler; it selects the worker helper that uses browser-friendly import
# paths. Pulls its own `rayon` with the `web_spin_lock` feature, which
# unifies onto `ezu-graph`/`ezu-paint`'s rayon so the parallel evaluator
# works on wasm.
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter"] }

[features]
default = ["panic-hook"]
panic-hook = ["dep:console_error_panic_hook"]
# Multithreaded rendering via wasm-bindgen-rayon. Off by default: it
# needs a nightly build (`-Z build-std`), an atomics/shared-memory wasm,
# and a cross-origin-isolated page (COOP/COEP). With it off the crate
# builds on stable and renders exactly as before. See README for the
# build recipe. When on, `initThreadPool` becomes available and the
# renderer uses the parallel evaluator once the pool is initialized.
threads = [
    "dep:wasm-bindgen-rayon",
    "ezu-graph/parallel",
    "ezu-paint/parallel",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd"]
