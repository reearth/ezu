[package]
name = "ezu-wasm"
description = "WebAssembly bindings for the ezu painterly map renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["wasm", "map", "cartography", "vector-tile", "rendering"]
categories = ["wasm", "graphics", "rendering", "science::geo"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ezu-core = { workspace = true }
ezu-mvt = { workspace = true }
ezu-paint = { workspace = true }
ezu-style = { workspace = true }
hokusai = { workspace = true, features = ["myb-json"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["panic-hook"]
panic-hook = ["dep:console_error_panic_hook"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd"]
