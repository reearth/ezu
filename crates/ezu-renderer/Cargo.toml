[package]
name = "ezu-renderer"
description = "Host-neutral tile renderer: the shared body behind ezu's embedding shells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Not published: the shells that use it (`ezu-wasm`) are not published
# either, and the API is deliberately free to move until more than one
# shell has been built against it.
publish = false

[dependencies]
ezu-core = { workspace = true, features = ["text"] }
ezu-graph = { workspace = true }
ezu-features = { workspace = true }
ezu-paint = { workspace = true }
ezu-style = { workspace = true }
hokusai = { workspace = true, features = ["myb-json"] }
serde_json = { workspace = true }
tracing = "0.1"

[features]
# Multithreaded evaluation. The shell decides whether a thread pool can
# exist at all, so it is off here and switched on from there.
parallel = ["ezu-graph/parallel", "ezu-paint/parallel"]
