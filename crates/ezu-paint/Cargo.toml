[package]
name = "ezu-paint"
description = "Paint GIS features onto a hokusai surface for ezu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["map", "cartography", "painterly", "brush", "ezu"]
categories = ["graphics", "rendering", "science::geo"]

[dependencies]
ezu-core = { workspace = true, features = ["text"] }
ezu-graph = { workspace = true }
ezu-features = { workspace = true }
ezu-style = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
maplibre-expr = { workspace = true }
rustybuzz = { workspace = true }
xxhash-rust = { workspace = true }
hokusai = { workspace = true, features = ["myb-json", "tile-mem", "tiny-skia"] }
tiny-skia = { workspace = true }
libblur = { workspace = true }
noise = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"

[features]
default = []
# Pull-through: enable parallel within-tile evaluation in ezu-graph,
# and turn on the chunked-MemSurface parallel paint helpers (Rayon).
parallel = ["ezu-graph/parallel", "dep:rayon"]
# Enable URL-fetch helpers in `host` (pulls in `reqwest`, `pmtiles`,
# `tokio`). Off by default so `wasm32` targets keep depending only on
# the JS host.
http = ["dep:reqwest", "dep:pmtiles", "dep:tokio"]

# System-font resolution (`system:` font scheme) queries the OS font
# database. There is no such database in a browser, so keep `fontdb`
# off the wasm build — the `system:` path errors at runtime there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb = { workspace = true }

[dependencies.rayon]
version = "1"
optional = true

[dependencies.reqwest]
workspace = true
# `blocking` backs the lazy glyph-range fetcher, which runs inside
# `Node::eval` (no async context available there).
features = ["blocking"]
optional = true

[dependencies.pmtiles]
workspace = true
optional = true

[dependencies.tokio]
workspace = true
features = ["sync"]
optional = true

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[bench]]
name = "paint"
harness = false
