[package]
name = "ezu"
description = "Painterly cartography engine: render vector tiles as paintings (umbrella crate)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["map", "cartography", "vector-tile", "rendering", "painterly"]
categories = ["graphics", "rendering", "science::geo"]

[features]
default = ["features", "paint", "style-json", "translate", "renderer"]
features = ["dep:ezu-features"]
paint = ["dep:ezu-paint"]
style-json = ["dep:ezu-style"]
translate = ["dep:ezu-translate"]
# The embedding renderer: bind each source's bytes, render a tile or a
# print frame. What the JS and Go packages are shells over.
renderer = [
    "features",
    "paint",
    "style-json",
    "ezu-core/text",
    "dep:hokusai",
    "dep:serde_json",
    "dep:tracing",
    "dep:xxhash-rust",
]
# Pull-through to ezu-graph's parallel within-tile evaluation.
parallel = ["ezu-graph/parallel", "ezu-paint?/parallel"]
# Pull-through to ezu-paint's URL-fetch helpers (`reqwest`-based).
http = ["ezu-paint?/http"]

[dependencies]
ezu-core = { workspace = true }
ezu-graph = { workspace = true }
ezu-features = { workspace = true, optional = true }
ezu-paint = { workspace = true, optional = true }
ezu-style = { workspace = true, optional = true }
ezu-translate = { workspace = true, optional = true }
# For the renderer: brushes bound as `.myb` JSON, the JSON it answers
# queries with, and its warnings.
hokusai = { workspace = true, optional = true, features = ["myb-json"] }
serde_json = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }
# For the renderer: a hash of each loaded payload, so the render cache
# tells two payloads for one tile apart.
xxhash-rust = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs"] }
tiny-skia = { workspace = true }
hokusai = { workspace = true, features = ["myb-json"] }
# Examples talk to remote PMTiles archives; the library itself does not.
pmtiles = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }

[[example]]
name = "inspect"
required-features = ["features"]
