[package]
name = "ezu"
description = "Painterly cartography engine: render vector tiles as paintings (umbrella crate)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["map", "cartography", "vector-tile", "rendering", "painterly"]
categories = ["graphics", "rendering", "science::geo"]

[features]
default = ["features", "paint", "style-json"]
features = ["dep:ezu-features"]
paint = ["dep:ezu-paint"]
style-json = ["dep:ezu-style"]
# Pull-through to ezu-graph's parallel within-tile evaluation.
parallel = ["ezu-graph/parallel", "ezu-paint?/parallel"]
# Pull-through to ezu-paint's URL-fetch helpers (`reqwest`-based).
http = ["ezu-paint?/http"]

[dependencies]
ezu-core = { workspace = true }
ezu-graph = { workspace = true }
ezu-features = { workspace = true, optional = true }
ezu-paint = { workspace = true, optional = true }
ezu-style = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs"] }
tiny-skia = { workspace = true }
hokusai = { workspace = true, features = ["myb-json"] }
futures = "0.3"
# Examples talk to remote PMTiles archives; the library itself does not.
pmtiles = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }

[[example]]
name = "tokyo"
required-features = ["features", "paint", "parallel", "http"]

[[example]]
name = "inspect"
required-features = ["features"]
