[package]
name = "ezu-graph"
description = "Typed DAG evaluator for the Ezu Style Spec v1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
ezu-style = { workspace = true }
indexmap = "2"
serde_json = { workspace = true }
thiserror = { workspace = true }
xxhash-rust = { workspace = true }
rayon = { version = "1", optional = true }

[features]
default = []
# Parallel within-tile node evaluation. Off by default so WASM and
# library users that drive their own threading don't pull in rayon.
parallel = ["dep:rayon"]
