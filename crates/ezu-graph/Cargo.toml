[package]
name = "ezu-graph"
description = "Typed DAG evaluator for the Ezu Style Spec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["dag", "graph", "evaluator", "ezu", "rendering"]
categories = ["graphics", "rendering", "data-structures"]

[dependencies]
ezu-style = { workspace = true }
indexmap = "2"
serde_json = { workspace = true }
thiserror = { workspace = true }
xxhash-rust = { workspace = true }
inventory = { workspace = true }
lru = "0.12"
rayon = { version = "1", optional = true }
tracing = "0.1"

[features]
default = []
# Parallel within-tile node evaluation. Off by default so WASM and
# library users that drive their own threading don't pull in rayon.
parallel = ["dep:rayon"]
