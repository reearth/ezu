[package]
name = "ezu-features"
description = "GIS feature parsing (MVT, GeoJSON) for ezu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["mvt", "geojson", "vector-tile", "gis", "ezu"]
categories = ["graphics", "rendering", "science::geo", "parser-implementations"]

[dependencies]
ezu-core = { workspace = true }
geozero = { workspace = true }
geojson = { workspace = true }
geo = { workspace = true }
i_overlay = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
voronoice = { workspace = true }
delaunator = { workspace = true }

# `geo`'s `multithreading` feature hands its overlay work to Rayon. A
# plain wasm build has no threads to hand it to, so the feature only
# costs code there; native builds keep it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
geo = { workspace = true, features = ["multithreading"] }
